[project]
name = "comfyui-h3-facerefine"
description = "Refine and improve the quality of small faces in MiniMax H3 video: per-frame face tracking, normalised crops, AV-latent injection and feathered stitch-back."
version = "1.1.2"
license = { file = "LICENSE" }
requires-python = ">=3.9"
readme = "README.md"
keywords = ["comfyui", "minimax-h3", "video", "face", "detailer", "upscale"]
classifiers = [
    "Operating System :: OS Independent",
]
dependencies = [
    "ultralytics",
    "scipy",
    "insightface",
    # Backs cut_detection="auto". Declared normally, unlike dghs-imgutils below:
    # it does not pin numpy, and its opencv-python requirement is already implied by
    # ultralytics, so it pulls in no OpenCV build that is not present anyway.
    "scenedetect>=0.7",
]
# dghs-imgutils is deliberately NOT declared here either. It backs identity_model="ccip",
# the anime identity backend, and it pins numpy<2 and pulls opencv-contrib-python - which
# shadows the OpenCV build ComfyUI ships, the same failure mode described below. It is
# imported only when that backend is selected, and the node says how to install it.
# Users who want it run:  pip install dghs-imgutils
#
# onnxruntime is deliberately NOT pinned here. insightface pulls the runtime it needs,
# and declaring onnxruntime-gpu alongside an existing onnxruntime makes the CPU-only
# package shadow it - CUDAExecutionProvider then disappears and identity matching
# silently drops to CPU. Users who want GPU should install one variant, not both.

[project.urls]
Repository = "https://github.com/Carasibana/ComfyUI-H3-FaceRefine"
"Bug Tracker" = "https://github.com/Carasibana/ComfyUI-H3-FaceRefine/issues"

# Test-only requirements, kept out of `dependencies`: a ComfyUI user installing the pack
# through the registry must never pull pytest. `tests/` runs on numpy alone - no ComfyUI,
# no torch, no weights, no GPU - which is what makes the geometry under multi-face
# pairing testable at all (see conftest.py and .github/workflows/tests.yml).
[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pack root is the import root for `plan_store` / `multi_face_nodes`. It is also a
# ComfyUI package whose `__init__.py` needs ComfyUI itself, so `h3_collection` keeps it
# out of the collection tree as a package - see that module for why.
pythonpath = ["."]
addopts = ["-p", "h3_collection"]

[tool.comfy]
PublisherId = "carasibana"
DisplayName = "ComfyUI-H3-FaceRefine"
Icon = "https://raw.githubusercontent.com/Carasibana/ComfyUI-H3-FaceRefine/main/assets/icon-h3-facerefine.svg"
